name: MongoDB migration checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/mongodb-atlas-migration]

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q app.py db.py groupsplit
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
